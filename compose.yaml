# compose.yaml - OCI Standard Compose file for AI Agent Execution Environment

services:
  agent-container:
    build:
      context: .
      dockerfile: Containerfile
      args:
        USE_CHINA_APT_MIRROR: ${USE_CHINA_APT_MIRROR:-true}
        USE_PROXY: ${USE_PROXY:-true}
        PROXY_IP: ${PROXY_IP:-192.168.3.70}
        PROXY_PORT: ${PROXY_PORT:-7890}
        PROXY_USER: ${PROXY_USER:-}
        PROXY_PASS: ${PROXY_PASS:-}
        USE_CHINA_NPM_MIRROR: ${USE_CHINA_NPM_MIRROR:-true}
        NODE_VERSION: ${NODE_VERSION:-26.8.2}
        PNPM_VERSION: ${PNPM_VERSION:-12.4.1}
        CODEX_VERSION: ${CODEX_VERSION:-0.154.0}
        PI_VERSION: ${PI_VERSION:-0.85.1}
    image: localhost/agent-container:${AGENT_CONTAINER_VERSION:-0.1.0}
    container_name: agent-container-${AGENT_CONTAINER_VERSION:-0.1.0}
    
    # Podman Rootless 最佳实践：保持当前宿主机用户 ID 映射
    userns_mode: "keep-id"
    
    # SSH 端口映射 (宿主机 2233 -> 容器 22)
    ports:
      - "${SSH_PORT:-2233}:22"
    
    # 容器内的工作目录
    working_dir: /home/agent/workspace
    
    # 挂载当前目录到容器内（:Z 标志用于 SELinux 兼容）
    volumes:
      - .:/home/agent/workspace:Z
    
    # 环境变量配置
    environment:
      - NODE_ENV=development
      - PYTHONUNBUFFERED=1
      # 可在本地环境变量中设置并在 compose 中引用：
      # - OPENAI_API_KEY=${OPENAI_API_KEY}

    # 支持交互式终端输入
    stdin_open: true
    tty: true

    # 启动 SSH 后进入交互式 Shell（借由免密 sudo 启动 sshd）
    command: /bin/bash -c "sudo /usr/sbin/sshd && /bin/bash"
