# compose.yaml - OCI Standard Compose file for AI Agent Execution Environment

services:
  agent-env:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/agent-env:latest
    container_name: agent-runtime
    
    # Podman Rootless 最佳实践：保持当前宿主机用户 ID 映射
    userns_mode: "keep-id"
    
    # SSH 端口映射 (宿主机 2233 -> 容器 22)
    ports:
      - "2233:22"
    
    # 容器内的工作目录
    working_dir: /home/agent/app
    
    # 挂载当前目录到容器内（:Z 标志用于 SELinux 兼容）
    volumes:
      - .:/home/agent/app:Z
    
    # 环境变量配置
    environment:
      - NODE_ENV=development
      - PYTHONUNBUFFERED=1
      # 可在本地环境变量中设置并在 compose 中引用：
      # - OPENAI_API_KEY=${OPENAI_API_KEY}

    # 支持交互式终端输入
    stdin_open: true
    tty: true

    # 启动 SSH 后进入交互式 Shell（借由免密 sudo 启动 sshd）
    command: /bin/bash -c "sudo /usr/sbin/sshd && /bin/bash"
